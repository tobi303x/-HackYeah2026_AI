services:
  flask-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hackyeah-flask-chroma
    ports:
      - "5000:5000"
    environment:
      - API_AUTH_KEY=${API_AUTH_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_EMBEDDING_MODEL=${GEMINI_EMBEDDING_MODEL:-gemini-embedding-2}
      - GEMINI_GENERATION_MODEL=${GEMINI_GENERATION_MODEL:-gemini-3.8-flash}
      - GEMINI_THINKING_LEVEL=${GEMINI_THINKING_LEVEL:-high}
      - CHROMA_PERSIST_DIRECTORY=/app/chroma_data
      - DEFAULT_COLLECTION_NAME=${DEFAULT_COLLECTION_NAME:-hackyeah_docs}
      - MOCK_EMBEDDINGS=${MOCK_EMBEDDINGS:-false}
    volumes:
      - chroma_data:/app/chroma_data
    restart: unless-stopped

volumes:
  chroma_data:
    driver: local
